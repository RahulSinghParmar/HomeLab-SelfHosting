name: Validate blueprint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    name: Static checks (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.14']
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Validate catalog and documentation
        run: python tools/validate_repository.py
      - name: Check tracked publication content
        run: python tools/check_publication.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Exercise offline planning
        run: python -m homelab plan --config examples/windows.settings.example.json --json
      - name: Exercise PowerShell entry point
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./bootstrap.ps1 validate --config examples/windows.settings.example.json
      - name: Exercise POSIX entry point
        if: runner.os != 'Windows'
        run: sh ./bootstrap.sh validate --config examples/linux.settings.example.json
      - name: Test Windows discovery privacy and output guards
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/Test-ReferenceCollector.ps1
